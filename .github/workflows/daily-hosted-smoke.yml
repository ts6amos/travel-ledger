name: Daily hosted smoke
on:
  push:
    branches: [main]
    paths:
      - 'daily/**'
      - '.github/workflows/daily-hosted-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Check the public daily app on a fresh mobile browser
        run: node daily/tests/hosted.cjs
